<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0720">
<title>NMS Admin</title>
<style>
:root{--bg:#f3f4fb;--card:#fff;--tx:#14162b;--mu:#5d6385;--bd:#dfe2f2;--ac:#5b5bf0;--ok:#0f9d58;--wa:#d97706;--rd:#d93025;--bl:#1a73e8;--pu:#8e44ad}
@media(prefers-color-scheme:dark){:root{--bg:#0b0720;--card:#171232;--tx:#ecebff;--mu:#9a98c4;--bd:#2b2557;--ac:#8b8bff;--ok:#3ddc84;--wa:#fbbf24;--rd:#ff6b6b;--bl:#6ea8ff;--pu:#c58bff}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,"Nirmala UI","Noto Sans Bengali",sans-serif;font-size:15px;line-height:1.5;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:760px;margin:0 auto;padding:12px}
h1{font-size:19px;margin:0}
button,input,select{font:inherit;color:inherit}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn:disabled{opacity:.55;cursor:default}
input[type=password],input[type=search]{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
#login{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px}
#login p{margin:6px 0 14px;color:var(--mu)}
.err{color:var(--rd);margin:10px 0 0;min-height:1.2em;font-size:14px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.top .r{display:flex;gap:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:10px 0;overflow:hidden}
.hd{padding:12px 14px;cursor:pointer}
.row1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.oid{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--mu)}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;border:1px solid currentColor;white-space:nowrap}
.pr{font-weight:600;margin:4px 0 2px}
.meta{color:var(--mu);font-size:13px}
.body{display:none;border-top:1px dashed var(--bd);padding:12px 14px}
.card.open .body{display:block}
.kv{margin:0 0 10px;font-size:14px}
.kv b{color:var(--mu);font-weight:600}
pre{white-space:pre-wrap;word-break:break-word;margin:0 0 10px;font-family:inherit;background:var(--bg);border-radius:10px;padding:10px;font-size:14px}
.warn{background:rgba(251,191,36,.18);border-radius:10px;padding:8px 10px;margin:0 0 10px;font-size:14px}
.sts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sts button{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:7px 11px;cursor:pointer;font-size:13px}
.sts button.cur{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.cp{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:1px 8px;font-size:12px;cursor:pointer;margin-left:4px}
a{color:var(--bl)}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:#222;color:#fff;border-radius:10px;padding:9px 14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.warnbar{background:rgba(217,48,37,.14);color:var(--rd);border:1px solid var(--rd);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px}.stats{font-size:13px;color:var(--mu);margin:2px 0 4px}
.empty{text-align:center;color:var(--mu);padding:40px 0}
.st-new{color:var(--wa)}.st-chk{color:var(--bl)}.st-pro{color:var(--pu)}.st-ok{color:var(--ok)}.st-no{color:var(--rd)}.st-ot{color:var(--mu)}
</style>
</head>
<body>
<div class="wrap">

<div id="login">
  <h1>🔐 NMS Admin</h1>
  <p>অর্ডার ম্যানেজ করতে পাসওয়ার্ড দিন।</p>
  <input id="pw" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password">
  <div class="err" id="lerr"></div>
  <button class="btn" id="lbtn" style="width:100%;margin-top:6px">লগিন</button>
</div>

<div id="app" style="display:none">
  <div class="bar">
    <div class="top">
      <h1>📦 অর্ডার</h1>
      <div class="r">
        <button class="btn s" id="rf">🔄 রিফ্রেশ</button>
        <button class="btn s" id="lo">বের হন</button>
      </div>
    </div>
    <div id="warn" class="warnbar" style="display:none"></div>
    <div id="stats" class="stats"></div>
    <input id="q" type="search" placeholder="সার্চ: Order ID, নাম, TrxID, পণ্য, Gmail...">
    <div class="chips" id="chips"></div>
  </div>
  <div id="list"></div>
</div>

</div>
<div id="toast"></div>

<script>
const API="https://script.google.com/macros/s/AKfycbzsCxVsEr9cV0gGSydd611_3pjWyZSvaOb0xWCeG_ykRiKGrlsolmZ_9A0dBZveH1TARg/exec";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let TOKEN="",ORDERS=[],STATUSES=[],FILTER="all",Q="",OPEN="",SEEN=null,TIMER=null,BUSY=false;
try{TOKEN=sessionStorage.getItem("nms_adm")||""}catch(e){}

async function api(body){
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),25000);
  try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),signal:ac.signal});return await r.json()}
  finally{clearTimeout(t)}
}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2600)}

function showLogin(msg){TOKEN="";try{sessionStorage.removeItem("nms_adm")}catch(e){}clearInterval(TIMER);$("app").style.display="none";$("login").style.display="block";$("lerr").textContent=msg||"";$("pw").value="";$("pw").focus()}
function showApp(){$("login").style.display="none";$("app").style.display="block";clearInterval(TIMER);TIMER=setInterval(()=>{if(!document.hidden)load(true)},30000)}

async function login(){
  const pw=$("pw").value;if(!pw)return;
  const b=$("lbtn");b.disabled=true;b.textContent="যাচাই হচ্ছে...";$("lerr").textContent="";
  try{
    const d=await api({action:"login",password:pw});
    if(d.ok){TOKEN=d.token;try{sessionStorage.setItem("nms_adm",TOKEN)}catch(e){}showApp();await load(false)}
    else $("lerr").textContent=d.err=="locked"?"অনেকবার ভুল দেওয়া হয়েছে। ১০ মিনিট পর আবার চেষ্টা করুন।":d.err=="nopass"?"সার্ভারে ADMIN_PASSWORD সেট করা নেই (কমপক্ষে ৮ অক্ষর)।":"পাসওয়ার্ড ভুল।";
  }catch(e){$("lerr").textContent="সার্ভারে যোগাযোগ করা যায়নি। ইন্টারনেট দেখে আবার চেষ্টা করুন."}
  b.disabled=false;b.textContent="লগিন";
}

async function load(silent){
  if(BUSY)return;BUSY=true;
  try{
    const d=await api({action:"list",token:TOKEN});
    if(!d.ok){if(d.err=="auth")showLogin("সেশন শেষ হয়েছে, আবার লগিন করুন।");else if(!silent)toast("তালিকা আনা যায়নি");return}
    ORDERS=d.orders||[];STATUSES=d.statuses||[];head(d.tgFail);
    const ids=new Set(ORDERS.map(o=>o.id));
    if(SEEN){const n=ORDERS.filter(o=>!SEEN.has(o.id)).length;if(n)toast("🛒 "+n+"টি নতুন অর্ডার এসেছে")}
    SEEN=ids;render();
  }catch(e){if(!silent)toast("ইন্টারনেট সমস্যা — আবার চেষ্টা করুন")}
  finally{BUSY=false}
}

function head(tg){const w=$("warn");
if(tg){w.style.display="block";w.textContent="⚠ Telegram বার্তা যাচ্ছে না ("+tg+")। বটের টোকেন ও Start যাচাই করে connectTelegram চালান।"}else w.style.display="none";
const today=new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Dhaka"}),t=ORDERS.filter(o=>String(o.time).slice(0,10)==today),live=t.filter(o=>!/বাতিল/.test(o.status));
$("stats").textContent="আজ: "+t.length+"টি অর্ডার · ৳"+live.reduce((x,o)=>x+(Number(o.total)||0),0)+" · নতুন (সব): "+ORDERS.filter(o=>o.status=="নতুন").length+"টি"}
function cls(s){return /বাতিল|cancel/i.test(s)?"st-no":/কমপ্লিট|ডেলিভারি|complete|deliver/i.test(s)?"st-ok":/প্রসেসিং/.test(s)?"st-pro":/যাচাই/.test(s)?"st-chk":s=="নতুন"?"st-new":"st-ot"}

function render(){
  const all=[...STATUSES];ORDERS.forEach(o=>{if(o.status&&!all.includes(o.status))all.push(o.status)});
  const cnt=s=>ORDERS.filter(o=>o.status==s).length;
  $("chips").innerHTML=`<button class="chip ${FILTER=="all"?"on":""}" data-f="all">সব (${ORDERS.length})</button>`+all.map(s=>`<button class="chip ${FILTER==s?"on":""}" data-f="${esc(s)}">${esc(s)} (${cnt(s)})</button>`).join("");
  const q=Q.trim().toLowerCase();
  const rows=ORDERS.filter(o=>(FILTER=="all"||o.status==FILTER)&&(!q||[o.id,o.name,o.trx,o.product,o.mail,o.details].join(" ").toLowerCase().includes(q)));
  if(!rows.length){$("list").innerHTML='<div class="empty">কোনো অর্ডার নেই</div>';return}
  $("list").innerHTML=rows.map(o=>{
    const open=OPEN==o.id;
    return `<div class="card ${open?"open":""}" data-id="${esc(o.id)}">
<div class="hd" data-act="toggle"><div class="row1"><span class="oid">${esc(o.id)} · ${esc(o.time)}</span><span class="badge ${cls(o.status)}">${esc(o.status)}</span></div>
<div class="pr">${esc(o.product)}</div><div class="meta">৳${esc(o.total)} · ${esc(o.pm)}${o.trx?" · "+esc(o.trx):""}${o.name?" · "+esc(o.name):""}</div></div>
<div class="body">
${o.note?`<div class="warn">${esc(o.note)}</div>`:""}
<div class="kv"><b>Order ID:</b> ${esc(o.id)} <button class="cp" data-act="copy" data-v="${esc(o.id)}">📋</button></div>
${o.trx?`<div class="kv"><b>TrxID:</b> ${esc(o.trx)} <button class="cp" data-act="copy" data-v="${esc(o.trx)}">📋</button></div>`:""}
${o.mail?`<div class="kv"><b>Gmail:</b> ${esc(o.mail)} <button class="cp" data-act="copy" data-v="${esc(o.mail)}">📋</button></div>`:""}
<pre>${esc(o.details)}</pre>
${/^https:\/\/(drive|docs)\.google\.com\//.test(o.shot)?`<div class="kv"><a href="${esc(o.shot)}" target="_blank" rel="noopener">📎 পেমেন্ট স্ক্রিনশট দেখুন</a></div>`:""}
<div class="kv"><b>স্ট্যাটাস বদলান:</b></div>
<div class="sts">${STATUSES.map(s=>`<button class="${o.status==s?"cur":""}" data-act="st" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div>
</div></div>`}).join("");
}

async function setStatus(id,st){
  const o=ORDERS.find(x=>x.id==id);if(!o||o.status==st)return;
  if(/বাতিল/.test(st)&&!confirm("এই অর্ডার বাতিল করবেন?"))return;
  const old=o.status;o.status=st;render();
  try{
    const d=await api({action:"setStatus",token:TOKEN,id:id,status:st});
    if(d.ok)toast(d.mailed?"✅ স্ট্যাটাস বদলেছে, ক্রেতাকে ইমেইল গেছে":"✅ স্ট্যাটাস বদলেছে");
    else if(d.err=="auth"){o.status=old;showLogin("সেশন শেষ হয়েছে, আবার লগিন করুন।")}
    else{o.status=old;render();toast("⚠ বদলানো যায়নি")}
  }catch(e){o.status=old;render();toast("⚠ ইন্টারনেট সমস্যা — বদলানো যায়নি")}
}

function copy(t){
  const ok=()=>toast("কপি হয়েছে");
  const fb=()=>{const a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){}a.remove()};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(ok,fb);else fb();
}

$("lbtn").onclick=login;
$("pw").addEventListener("keydown",e=>{if(e.key=="Enter")login()});
$("rf").onclick=()=>load(false);
$("lo").onclick=()=>showLogin("");
$("q").addEventListener("input",e=>{Q=e.target.value;render()});
$("chips").addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(b){FILTER=b.dataset.f;render()}});
$("list").addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");if(!a)return;
  const id=a.closest(".card").dataset.id;
  if(a.dataset.act=="toggle"){OPEN=OPEN==id?"":id;render()}
  else if(a.dataset.act=="copy")copy(a.dataset.v);
  else if(a.dataset.act=="st")setStatus(id,a.dataset.s);
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&TOKEN)load(true)});

if(TOKEN){showApp();load(false)}else showLogin("");
</script>
</body>
</html>
