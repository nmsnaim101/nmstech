<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0720">
<title>NMS Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400..800&family=Anek+Latin:wght@400..800&display=swap" rel="stylesheet">

<style>
:root{--bg:#f3f4fb;--card:#fff;--tx:#14162b;--mu:#5d6385;--bd:#dfe2f2;--ac:#5b5bf0;--ok:#0f9d58;--wa:#d97706;--rd:#d93025;--bl:#1a73e8;--pu:#8e44ad}
@media(prefers-color-scheme:dark){:root{--bg:#0b0720;--card:#171232;--tx:#ecebff;--mu:#9a98c4;--bd:#2b2557;--ac:#8b8bff;--ok:#3ddc84;--wa:#fbbf24;--rd:#ff6b6b;--bl:#6ea8ff;--pu:#c58bff}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Anek Latin","Anek Bangla",system-ui,"Nirmala UI","Noto Sans Bengali",sans-serif;font-size:15px;line-height:1.5;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:760px;margin:0 auto;padding:12px}
h1{font-size:19px;margin:0}
button,input,select{font:inherit;color:inherit}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.s{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn:disabled{opacity:.55;cursor:default}
input[type=password],input[type=search]{width:100%;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
#login{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px}
#login p{margin:6px 0 14px;color:var(--mu)}
.err{color:var(--rd);margin:10px 0 0;min-height:1.2em;font-size:14px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.top .r{display:flex;gap:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:10px 0;overflow:hidden}
.hd{padding:12px 14px;cursor:pointer}
.row1{display:flex;justify-content:space-between;gap:8px;align-items:center}
.oid{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;color:var(--mu)}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;border:1px solid currentColor;white-space:nowrap}
.pr{font-weight:600;margin:4px 0 2px}
.meta{color:var(--mu);font-size:13px}
.body{display:none;border-top:1px dashed var(--bd);padding:12px 14px}
.card.open .body{display:block}
.kv{margin:0 0 10px;font-size:14px}
.kv b{color:var(--mu);font-weight:600}
pre{white-space:pre-wrap;word-break:break-word;margin:0 0 10px;font-family:inherit;background:var(--bg);border-radius:10px;padding:10px;font-size:14px}
.warn{background:rgba(251,191,36,.18);border-radius:10px;padding:8px 10px;margin:0 0 10px;font-size:14px}
.sts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sts button{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:7px 11px;cursor:pointer;font-size:13px}
.sts button.cur{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.cp{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:1px 8px;font-size:12px;cursor:pointer;margin-left:4px}
a{color:var(--bl)}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:#222;color:#fff;border-radius:10px;padding:9px 14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.warnbar{background:rgba(217,48,37,.14);color:var(--rd);border:1px solid var(--rd);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px}.stats{font-size:13px;color:var(--mu);margin:2px 0 4px}
.seg{display:flex;gap:6px;margin:0 0 6px}.seg button{flex:1;border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:8px;cursor:pointer;font-weight:600}.seg button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.prow{display:flex;gap:10px;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0}
.prow.chg{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}.prow.off .pn{opacity:.5}
.pn{min-width:0;flex:1}.pn b{display:block;font-size:14px;line-height:1.35;word-break:break-word}.pn small{color:var(--mu);font-size:12px}
.pc{display:flex;flex-direction:column;align-items:flex-end;gap:4px}.pp{width:100px;text-align:right;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 8px}
.pav{font-size:13px;color:var(--mu);display:flex;align-items:center;gap:4px;cursor:pointer}
.bulk{display:flex;gap:6px;margin:6px 0 2px}.bulk input{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px}
#psave{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);display:none;z-index:15}
#psave .wrap{display:flex;gap:8px;max-width:760px;margin:0 auto;padding:0}
.empty{text-align:center;color:var(--mu);padding:40px 0}
.st-new{color:var(--wa)}.st-chk{color:var(--bl)}.st-pro{color:var(--pu)}.st-ok{color:var(--ok)}.st-no{color:var(--rd)}.st-ot{color:var(--mu)}

.seg{gap:8px;margin:0 0 8px}.seg button{padding:13px 8px;font-size:16px;border-radius:12px;min-height:48px}
.chip{padding:9px 15px;font-size:14px;min-height:40px}
.grp{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:8px 0;overflow:hidden}
.grp>summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;min-height:48px}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary small{color:var(--mu);font-weight:500;font-size:12px}
.grp>summary:after{content:"▾";color:var(--mu);transition:transform .15s}.grp[open]>summary:after{transform:rotate(180deg)}
.grp .gn{min-width:0;flex:1}.grp .gc{color:var(--ac);font-size:12px;font-weight:700}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 8px 10px}
.pg .prow{flex-direction:column;align-items:stretch;margin:0;padding:10px}
.pg .pc{flex-direction:row;justify-content:space-between;align-items:center}
.pg .pp{width:100%;min-width:0;text-align:left;font-size:16px;padding:8px}
.pg .pav{white-space:nowrap}
.pg .pn b{font-size:13px}
@media(min-width:620px){.pg{grid-template-columns:repeat(3,1fr)}}
.note{width:100%;min-height:64px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin:0 0 8px;font:inherit}
.hasn{font-size:12px;color:var(--wa)}

.bulk select{flex:1;min-width:0;background:var(--card);color:inherit;border:1px solid var(--bd);border-radius:10px;padding:10px}
.bulk input[type=date]{flex:1;min-width:0}
.rs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.rs div{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;display:flex;flex-direction:column}.rs b{font-size:20px}.rs small{color:var(--mu)}
.rbar{display:grid;grid-template-columns:78px 1fr auto;gap:8px;align-items:center;margin:6px 0;font-size:13px}.rbar div{background:var(--bd);border-radius:6px;height:12px;overflow:hidden}.rbar i{display:block;height:100%;background:var(--ac)}
.rtop{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}
</style>
</head>
<body>
<div class="wrap">

<div id="login">
  <h1>🔐 NMS Admin</h1>
  <p>অর্ডার ম্যানেজ করতে পাসওয়ার্ড দিন।</p>
  <input id="pw" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password">
  <input id="otp" inputmode="numeric" maxlength="6" placeholder="Telegram-এর ৬ সংখ্যার কোড" style="display:none">
  <div class="err" id="lerr"></div>
  <button class="btn" id="lbtn" style="width:100%;margin-top:6px">লগিন</button>
</div>

<div id="app" style="display:none">
  <div class="bar">
    <div class="top">
      <h1>📦 অর্ডার</h1>
      <div class="r">
        <button class="btn s" id="rf">🔄 রিফ্রেশ</button>
        <button class="btn s" id="csv">⬇ CSV</button>
        <button class="btn s" id="lo">বের হন</button>
      </div>
    </div>
    <div class="seg"><button class="on" id="tabO">📦 অর্ডার</button><button id="tabP">💰 দাম</button><button id="tabR">📊 রিপোর্ট</button></div>
    <div id="oc">
      <div id="warn" class="warnbar" style="display:none"></div>
      <div id="stats" class="stats"></div>
      <input id="q" type="search" placeholder="সার্চ: Order ID, নাম, TrxID, পণ্য, Gmail...">
      <div class="bulk"><input id="d1" type="date" title="শুরুর তারিখ"><input id="d2" type="date" title="শেষ তারিখ"><button class="btn s" id="dclr">✕ তারিখ</button></div>
      <div class="chips" id="chips"></div>
      <div class="bulk"><select id="bst"></select><button class="btn s" id="bsb">দেখানো অর্ডারে স্ট্যাটাস বদলান</button></div>
    </div>
    <div id="pc" style="display:none">
      <input id="pq" type="search" placeholder="সার্চ: পণ্যের নাম বা গ্রুপ...">
      <div class="chips" id="pchips"></div>
      <div class="bulk"><input id="bulkp" type="number" step="0.1" placeholder="% (যেমন 5 বা -5)"><button class="btn s" id="bulkb">দেখানো সারিতে %</button></div>
    </div>
  </div>
  <div id="list"></div>
  <div id="rc" style="display:none"></div>
  <div id="plist" style="display:none"></div>
  <div style="height:80px"></div>
  <div id="psave"><div class="wrap"><button class="btn" id="psb" style="flex:1"></button><button class="btn s" id="prs">↩ বাতিল</button></div></div>
</div>

</div>
<div id="toast"></div>

<script src="catalog.js"></script>
<script>
const API="https://script.google.com/macros/s/AKfycbzsCxVsEr9cV0gGSydd611_3pjWyZSvaOb0xWCeG_ykRiKGrlsolmZ_9A0dBZveH1TARg/exec";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let TOKEN="",ORDERS=[],STATUSES=[],FILTER="all",Q="",OPEN="",SEEN=null,TIMER=null,BUSY=false;
try{TOKEN=sessionStorage.getItem("nms_adm")||""}catch(e){}

async function api(body){
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),25000);
  try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),signal:ac.signal});return await r.json()}
  finally{clearTimeout(t)}
}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("on"),2600)}

function showLogin(msg){TOKEN="";try{sessionStorage.removeItem("nms_adm")}catch(e){}clearInterval(TIMER);$("app").style.display="none";$("login").style.display="block";$("lerr").textContent=msg||"";$("pw").value="";$("pw").focus()}
function showApp(){$("login").style.display="none";$("app").style.display="block";clearInterval(TIMER);TIMER=setInterval(()=>{if(!document.hidden)load(true)},30000)}

async function login(){
  const pw=$("pw").value;if(!pw)return;
  const b=$("lbtn");b.disabled=true;b.textContent="যাচাই হচ্ছে...";$("lerr").textContent="";
  try{
    const d=await api({action:"login",password:pw,otp:$("otp").value.trim()});
    if(d.ok){TOKEN=d.token;try{sessionStorage.setItem("nms_adm",TOKEN)}catch(e){}showApp();await load(false)}
    else if(d.err=="otp"||d.err=="otpbad"){$("otp").style.display="";$("otp").value="";$("otp").focus();$("lerr").textContent=d.err=="otp"?"✅ Telegram-এ কোড পাঠানো হয়েছে। কোড দিয়ে আবার লগিন চাপুন।":"কোড ভুল বা মেয়াদ শেষ। কোড খালি রেখে লগিন চাপলে নতুন কোড যাবে।"}
    else $("lerr").textContent=d.err=="locked"?"অনেকবার ভুল দেওয়া হয়েছে। ১০ মিনিট পর আবার চেষ্টা করুন।":d.err=="nopass"?"সার্ভারে ADMIN_PASSWORD সেট করা নেই (কমপক্ষে ৮ অক্ষর)।":"পাসওয়ার্ড ভুল।";
  }catch(e){$("lerr").textContent="সার্ভারে যোগাযোগ করা যায়নি। ইন্টারনেট দেখে আবার চেষ্টা করুন."}
  b.disabled=false;b.textContent="লগিন";
}

async function load(silent){
  if(BUSY)return;BUSY=true;
  try{
    const d=await api({action:"list",token:TOKEN});
    if(!d.ok){if(d.err=="auth")showLogin("সেশন শেষ হয়েছে, আবার লগিন করুন।");else if(!silent)toast("তালিকা আনা যায়নি");return}
    ORDERS=d.orders||[];STATUSES=d.statuses||[];head(d.tgFail);
    const ids=new Set(ORDERS.map(o=>o.id));
    if(SEEN){const n=ORDERS.filter(o=>!SEEN.has(o.id)).length;if(n)toast("🛒 "+n+"টি নতুন অর্ডার এসেছে")}
    SEEN=ids;render();
  }catch(e){if(!silent)toast("ইন্টারনেট সমস্যা — আবার চেষ্টা করুন")}
  finally{BUSY=false}
}

function head(tg){const w=$("warn");
if(tg){w.style.display="block";w.textContent="⚠ Telegram বার্তা যাচ্ছে না ("+tg+")। বটের টোকেন ও Start যাচাই করে connectTelegram চালান।"}else w.style.display="none";
const today=new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Dhaka"}),t=ORDERS.filter(o=>String(o.time).slice(0,10)==today),live=t.filter(o=>!/বাতিল/.test(o.status));
$("stats").textContent="আজ: "+t.length+"টি অর্ডার · ৳"+live.reduce((x,o)=>x+(Number(o.total)||0),0)+" · নতুন (সব): "+ORDERS.filter(o=>o.status=="নতুন").length+"টি"}
function cls(s){return /বাতিল|cancel/i.test(s)?"st-no":/কমপ্লিট|ডেলিভারি|complete|deliver/i.test(s)?"st-ok":/প্রসেসিং/.test(s)?"st-pro":/যাচাই/.test(s)?"st-chk":s=="নতুন"?"st-new":"st-ot"}

function render(){
  if(!$("bst").options.length)$("bst").innerHTML=STATUSES.map(x=>`<option>${esc(x)}</option>`).join("");
  const all=[...STATUSES];ORDERS.forEach(o=>{if(o.status&&!all.includes(o.status))all.push(o.status)});
  const cnt=s=>ORDERS.filter(o=>o.status==s).length;
  $("chips").innerHTML=`<button class="chip ${FILTER=="all"?"on":""}" data-f="all">সব (${ORDERS.length})</button>`+all.map(s=>`<button class="chip ${FILTER==s?"on":""}" data-f="${esc(s)}">${esc(s)} (${cnt(s)})</button>`).join("");
  const q=Q.trim().toLowerCase();
  const rows=ORDERS.filter(o=>(FILTER=="all"||o.status==FILTER)&&dOK(o)&&(!q||[o.id,o.name,o.trx,o.product,o.mail,o.details].join(" ").toLowerCase().includes(q)));
  if(!rows.length){$("list").innerHTML='<div class="empty">কোনো অর্ডার নেই</div>';return}
  $("list").innerHTML=rows.map(o=>{
    const open=OPEN==o.id;
    return `<div class="card ${open?"open":""}" data-id="${esc(o.id)}">
<div class="hd" data-act="toggle"><div class="row1"><span class="oid">${esc(o.id)} · ${esc(o.time)}${getNote(o)?' <span class="hasn">📝</span>':""}</span><span class="badge ${cls(o.status)}">${esc(o.status)}</span></div>
<div class="pr">${esc(o.product)}</div><div class="meta">৳${esc(o.total)} · ${esc(o.pm)}${o.trx?" · "+esc(o.trx):""}${o.name?" · "+esc(o.name):""}</div></div>
<div class="body">
${o.note?`<div class="warn">${esc(o.note)}</div>`:""}
<div class="kv"><b>Order ID:</b> ${esc(o.id)} <button class="cp" data-act="copy" data-v="${esc(o.id)}">📋</button></div>
${o.trx?`<div class="kv"><b>TrxID:</b> ${esc(o.trx)} <button class="cp" data-act="copy" data-v="${esc(o.trx)}">📋</button></div>`:""}
${o.mail?`<div class="kv"><b>Gmail:</b> ${esc(o.mail)} <button class="cp" data-act="copy" data-v="${esc(o.mail)}">📋</button></div>`:""}
<pre>${esc(o.details)}</pre>
${/^https:\/\/(drive|docs)\.google\.com\//.test(o.shot)?`<div class="kv"><a href="${esc(o.shot)}" target="_blank" rel="noopener">📎 পেমেন্ট স্ক্রিনশট দেখুন</a></div>`:""}
<div class="kv"><b>📝 নোট (শুধু আপনার জন্য):</b></div>
<textarea class="note" data-act="note" placeholder="যেমন: কাস্টমারকে ফোন দিয়েছি, UID ভুল ছিল...">${esc(getNote(o))}</textarea>
<div class="kv"><b>স্ট্যাটাস বদলান:</b></div>
<div class="sts">${STATUSES.map(s=>`<button class="${o.status==s?"cur":""}" data-act="st" data-s="${esc(s)}">${esc(s)}</button>`).join("")}</div>
</div></div>`}).join("");
}

async function setStatus(id,st){
  const o=ORDERS.find(x=>x.id==id);if(!o||o.status==st)return;
  if(/বাতিল/.test(st)&&!confirm("এই অর্ডার বাতিল করবেন?"))return;
  const old=o.status;o.status=st;render();
  try{
    const d=await api({action:"setStatus",token:TOKEN,id:id,status:st});
    if(d.ok)toast(d.mailed?"✅ স্ট্যাটাস বদলেছে, ক্রেতাকে ইমেইল গেছে":"✅ স্ট্যাটাস বদলেছে");
    else if(d.err=="auth"){o.status=old;showLogin("সেশন শেষ হয়েছে, আবার লগিন করুন।")}
    else{o.status=old;render();toast("⚠ বদলানো যায়নি")}
  }catch(e){o.status=old;render();toast("⚠ ইন্টারনেট সমস্যা — বদলানো যায়নি")}
}

function copy(t){
  const ok=()=>toast("কপি হয়েছে");
  const fb=()=>{const a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){}a.remove()};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(ok,fb);else fb();
}

$("lbtn").onclick=login;
$("pw").addEventListener("keydown",e=>{if(e.key=="Enter")login()});
$("rf").onclick=()=>load(false);
$("lo").onclick=()=>showLogin("");
$("q").addEventListener("input",e=>{Q=e.target.value;render()});
$("chips").addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(b){FILTER=b.dataset.f;render()}});
$("list").addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");if(!a)return;
  const id=a.closest(".card").dataset.id;
  if(a.dataset.act=="toggle"){OPEN=OPEN==id?"":id;render()}
  else if(a.dataset.act=="copy")copy(a.dataset.v);
  else if(a.dataset.act=="st")setStatus(id,a.dataset.s);
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&TOKEN)load(true)});



/* ---------- 📅 তারিখ ফিল্টার, ☑ একসাথে স্ট্যাটাস, 📊 রিপোর্ট ---------- */
let D1="",D2="",RP="d";
const dOK=o=>{const d=String(o.time).slice(0,10);return(!D1||d>=D1)&&(!D2||d<=D2)};
$("d1").onchange=e=>{D1=e.target.value;render()};$("d2").onchange=e=>{D2=e.target.value;render()};
$("dclr").onclick=()=>{D1=D2="";$("d1").value=$("d2").value="";render()};
function visO(){const q=Q.trim().toLowerCase();return ORDERS.filter(o=>(FILTER=="all"||o.status==FILTER)&&dOK(o)&&(!q||[o.id,o.name,o.trx,o.product,o.mail,o.details].join(" ").toLowerCase().includes(q)))}
$("bsb").onclick=async()=>{const st=$("bst").value,rows=visO().filter(o=>o.status!=st).slice(0,60);
if(!st||!rows.length){toast("বদলানোর মতো অর্ডার নেই");return}
if(!confirm(rows.length+"টি অর্ডারের স্ট্যাটাস \""+st+"\" করবেন?"+(/কমপ্লিট/.test(st)?"\n(ক্রেতাদের ইমেইলও যাবে)":"")))return;
let ok=0;for(const o of rows){try{const d=await api({action:"setStatus",token:TOKEN,id:o.id,status:st});if(d.ok){o.status=st;ok++}}catch(e){}}
render();toast("✅ "+ok+"/"+rows.length+"টি বদলেছে")};
function drawReport(){
const live=ORDERS.filter(o=>o.status!=="বাতিল"),dn=ORDERS.filter(o=>/কমপ্লিট/.test(o.status)),sum=a=>a.reduce((x,o)=>x+(Number(o.total)||0),0);
const key=o=>{const d=String(o.time).slice(0,10);if(RP=="m")return d.slice(0,7);if(RP=="w"){const t=new Date(d+"T00:00:00Z"),w=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-w);return t.toISOString().slice(0,10)}return d};
const g={};live.forEach(o=>{const k=key(o);g[k]=g[k]||{n:0,t:0};g[k].n++;g[k].t+=Number(o.total)||0});
const ks=Object.keys(g).sort().slice(-(RP=="d"?14:RP=="w"?8:6)),mx=Math.max(1,...ks.map(k=>g[k].t));
const top={};live.forEach(o=>{const n=String(o.product).replace(/^[^\p{L}\p{N}]+/u,"").replace(/\s*\([^()]*\)\s*$/,"");top[n]=top[n]||{n:0,t:0};top[n].n++;top[n].t+=Number(o.total)||0});
const tl=Object.entries(top).sort((a,b)=>b[1].n-a[1].n).slice(0,8),lb=RP=="d"?"দিন":RP=="w"?"সপ্তাহ (সোমবার থেকে)":"মাস";
$("rc").innerHTML=`<div class="chips">${[["d","দিন"],["w","সপ্তাহ"],["m","মাস"]].map(([k,t])=>`<button class="chip ${RP==k?"on":""}" data-rp="${k}">${t}</button>`).join("")}</div>
<div class="rs"><div><b>${live.length}</b><small>অর্ডার (বাতিল বাদে)</small></div><div><b>৳${sum(live)}</b><small>মোট বিক্রি</small></div><div><b>৳${sum(dn)}</b><small>কমপ্লিট</small></div><div><b>${ORDERS.length-live.length}</b><small>বাতিল</small></div></div>
<h3 style="margin:14px 0 6px">${lb} অনুযায়ী বিক্রি</h3>
${ks.map(k=>`<div class="rbar"><span>${esc(k)}</span><div><i style="width:${Math.max(3,Math.round(g[k].t/mx*100))}%"></i></div><b>৳${g[k].t} · ${g[k].n}টি</b></div>`).join("")||'<div class="empty">ডেটা নেই</div>'}
<h3 style="margin:14px 0 6px">🔥 সবচেয়ে বেশি বিক্রি</h3>
${tl.map(([n,v],i)=>`<div class="rtop"><span>${i+1}. ${esc(n)}</span><b>${v.n}টি · ৳${v.t}</b></div>`).join("")}
<p class="meta" style="margin-top:12px">শুধু সর্বশেষ ${ORDERS.length}টি অর্ডার ধরে হিসাব।</p>`}
$("rc").addEventListener("click",e=>{const b=e.target.closest("[data-rp]");if(b){RP=b.dataset.rp;drawReport()}});
$("tabR").onclick=()=>setView("r");

/* ---------- 📝 নোট ও ⬇ CSV ---------- */
let NOTES={};try{NOTES=JSON.parse(localStorage.getItem("nms_notes")||"{}")}catch(e){}
const getNote=o=>NOTES[o.id]!==undefined?NOTES[o.id]:(o.adminNote||"");
let noteT;
function saveNote(id,v){NOTES[id]=v;try{localStorage.setItem("nms_notes",JSON.stringify(NOTES))}catch(e){}
clearTimeout(noteT);noteT=setTimeout(()=>{api({action:"setNote",token:TOKEN,id:id,note:v}).catch(()=>{});toast("📝 নোট সেভ হয়েছে")},900)}
$("list").addEventListener("input",e=>{const t=e.target;if(t.dataset.act!="note")return;saveNote(t.closest(".card").dataset.id,t.value)});
function csvCell(v){v=String(v==null?"":v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCSV(){
  const q=Q.trim().toLowerCase();
  const rows=ORDERS.filter(o=>(FILTER=="all"||o.status==FILTER)&&dOK(o)&&(!q||[o.id,o.name,o.trx,o.product,o.mail,o.details].join(" ").toLowerCase().includes(q)));
  if(!rows.length){toast("নামানোর মতো অর্ডার নেই");return}
  const H=["Order ID","সময়","পণ্য","মোট (৳)","পেমেন্ট","TrxID","নাম","Gmail","স্ট্যাটাস","বিস্তারিত","নোট"];
  const L=[H.map(csvCell).join(",")].concat(rows.map(o=>[o.id,o.time,o.product,o.total,o.pm,o.trx,o.name,o.mail,o.status,o.details,getNote(o)].map(csvCell).join(",")));
  const b=new Blob(["\uFEFF"+L.join("\r\n")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download="nms-orders-"+new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Dhaka"})+".csv";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast("⬇ "+rows.length+"টি অর্ডার নামানো হয়েছে")}
$("csv").onclick=exportCSV;

/* ---------- 💰 দাম ম্যানেজমেন্ট ---------- */
let VIEW="o",PR=[],PFL="all",PQ2="";
function setView(v){VIEW=v;$("tabR").classList.toggle("on",v=="r");$("rc").style.display=v=="r"?"":"none";if(v=="r"){["oc","list","pc","plist","psave"].forEach(i=>$(i).style.display="none");$("tabO").classList.remove("on");$("tabP").classList.remove("on");drawReport();return}$("tabO").classList.toggle("on",v=="o");$("tabP").classList.toggle("on",v=="p");
$("oc").style.display=v=="o"?"":"none";$("list").style.display=v=="o"?"":"none";$("pc").style.display=v=="p"?"":"none";$("plist").style.display=v=="p"?"":"none";
if(v=="p")loadPriceRows();else $("psave").style.display="none"}
async function loadPriceRows(){const l=$("plist");l.innerHTML='<div class="empty">লোড হচ্ছে...</div>';
try{let d=await api({action:"listPrices",token:TOKEN});
if(!d.ok){if(d.err=="auth"){showLogin("সেশন শেষ হয়েছে, আবার লগিন করুন।");return}throw 0}
const cat=typeof CATALOG!="undefined"?CATALOG:[],have=new Set(d.rows.map(r=>r.key)),miss=cat.filter(c=>!have.has(c.key));
if(miss.length){for(let i=0;i<miss.length;i+=100){const s=await api({action:"syncPrices",token:TOKEN,items:miss.slice(i,i+100)});if(!s.ok)throw 0}
d=await api({action:"listPrices",token:TOKEN});toast("🔄 "+miss.length+"টি পণ্য দামের তালিকায় যোগ হয়েছে")}
const def={};cat.forEach(c=>{def[c.key]=c.p});
PR=d.rows.filter(r=>!cat.length||def[r.key]!==undefined).map(r=>({...r,op:r.p,oav:r.av,def:def[r.key]}));renderP()}
catch(e){l.innerHTML='<div class="empty">দাম লোড করা যায়নি। রিফ্রেশ করে আবার চেষ্টা করুন।</div>'}}
const chgd=r=>Number(r.p)!==r.op||r.av!==r.oav;
function visP(){const q=PQ2.trim().toLowerCase();return PR.filter(r=>(PFL=="all"||r.type==PFL)&&(!q||(r.name+" "+r.group+" "+r.key).toLowerCase().includes(q)))}
const TL={Digital:"ডিজিটাল প্রোডাক্ট",SMM:"SMM সার্ভিস",Subscription:"সাবস্ক্রিপশন","Top-Up":"টপ-আপ",Service:"সার্ভিস"};
const tl=t=>TL[t]||t;
const clean=x=>String(x||"").replace(/^[^\p{L}\p{N}]+/u,"").replace(/\s*\([^()]*\)\s*$/,"").trim();
const tidyName=r=>{let n=String(r.name||"").replace(/^[^\p{L}\p{N}]+/u,"");
  n=n.replace(/\s*\((?:[^()]*)\)\s*$/,"").replace(/\s+/g," ").trim();return n.length>70?n.slice(0,68)+"…":n};
const PGO=new Set();
function renderP(){const types=[...new Set(PR.map(r=>r.type))];
$("pchips").innerHTML=`<button class="chip ${PFL=="all"?"on":""}" data-pf="all">সব (${PR.length})</button>`+types.map(t=>`<button class="chip ${PFL==t?"on":""}" data-pf="${esc(t)}">${esc(tl(t))} (${PR.filter(r=>r.type==t).length})</button>`).join("");
const rows=visP(),G={};rows.forEach(r=>{const k=r.type+"||"+r.group;(G[k]=G[k]||[]).push(r)});
const searching=PQ2.trim()!=="",ks=Object.keys(G);
$("plist").innerHTML=ks.map(k=>{const g=G[k],c=g.filter(chgd).length,ttl=clean(g[0].group)||g[0].group,open=searching||PGO.has(k)||c>0;
return `<details class="grp" data-g="${esc(k)}"${open?" open":""}><summary><span class="gn">${esc(ttl)}<br><small>${esc(tl(g[0].type))} · ${g.length}টি${g[0].type=="SMM"?" · প্রতি ১ হাজার":""}</small></span>${c?`<span class="gc">✎ ${c}</span>`:""}</summary><div class="pg">`+
g.map(r=>`<div class="prow${chgd(r)?" chg":""}${r.av?"":" off"}" data-key="${esc(r.key)}"><div class="pn"><b>${esc(tidyName(r))}</b></div><div class="pc"><span class="meta">৳</span><input class="pp" type="number" inputmode="decimal" step="0.01" min="0" value="${esc(r.p)}" data-act="pp"><label class="pav"><input type="checkbox" data-act="pav" ${r.av?"checked":""}> চালু</label></div></div>`).join("")+`</div></details>`}).join("")||'<div class="empty">কিছু পাওয়া যায়নি</div>';
updSave()}
$("plist").addEventListener("toggle",e=>{const d=e.target;if(!d.dataset||!d.dataset.g)return;d.open?PGO.add(d.dataset.g):PGO.delete(d.dataset.g)},true);
function updSave(){const n=PR.filter(chgd).length,b=$("psb");$("psave").style.display=VIEW=="p"&&n?"block":"none";b.textContent="💾 সেভ করুন ("+n+"টি পরিবর্তন)"}
async function savePrices(){const ch=PR.filter(chgd);if(!ch.length)return;
if(ch.some(r=>!isFinite(Number(r.p))||Number(r.p)<0)){toast("⚠ সব দাম সঠিক সংখ্যায় দিন");return}
const b=$("psb");b.disabled=true;b.textContent="সেভ হচ্ছে...";
try{let n=0;for(let i=0;i<ch.length;i+=100){const d=await api({action:"setPrices",token:TOKEN,changes:ch.slice(i,i+100).map(r=>({key:r.key,p:Number(r.p),av:r.av}))});
if(!d.ok){if(d.err=="auth"){showLogin("সেশন শেষ হয়েছে, আবার লগিন করুন।");return}throw 0}n+=d.changed}
ch.forEach(r=>{r.p=Number(r.p);r.op=r.p;r.oav=r.av});toast("✅ "+n+"টি সেভ হয়েছে — সাইটে ১ মিনিটের মধ্যে দেখাবে")}
catch(e){toast("⚠ সেভ করা যায়নি — আবার চেষ্টা করুন")}
b.disabled=false;renderP()}
$("tabO").onclick=()=>setView("o");$("tabP").onclick=()=>setView("p");
$("pq").addEventListener("input",e=>{PQ2=e.target.value;renderP()});
$("pchips").addEventListener("click",e=>{const b=e.target.closest("[data-pf]");if(b){PFL=b.dataset.pf;renderP()}});
$("plist").addEventListener("input",e=>{const t=e.target;if(t.dataset.act!="pp")return;const row=t.closest(".prow"),r=PR.find(x=>x.key==row.dataset.key);if(!r)return;r.p=t.value===""?NaN:Number(t.value);row.classList.toggle("chg",chgd(r));updSave()});
$("plist").addEventListener("change",e=>{const t=e.target;if(t.dataset.act!="pav")return;const row=t.closest(".prow"),r=PR.find(x=>x.key==row.dataset.key);if(!r)return;r.av=t.checked?1:0;row.classList.toggle("off",!r.av);row.classList.toggle("chg",chgd(r));updSave()});
$("bulkb").onclick=()=>{const pct=parseFloat($("bulkp").value);if(!isFinite(pct)||pct<=-100||pct>500){toast("সঠিক % দিন (যেমন 5 বা -5)");return}
const rows=visP();if(!rows.length)return;if(!confirm("এখন দেখানো "+rows.length+"টি পণ্যের দাম "+pct+"% বদলাবেন? (সেভ না করা পর্যন্ত সাইটে বদলাবে না)"))return;
rows.forEach(r=>{r.p=Math.round(Number(r.p)*(1+pct/100)*100)/100});renderP()};
$("psb").onclick=savePrices;
$("prs").onclick=()=>{if(confirm("সব অসংরক্ষিত পরিবর্তন বাতিল করবেন?")){PR.forEach(r=>{r.p=r.op;r.av=r.oav});renderP()}};

if(TOKEN){showApp();load(false)}else showLogin("");
</script>
</body>
</html>
